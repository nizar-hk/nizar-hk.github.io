# Site Configuration
theme: jekyll-theme-chirpy
lang: en
timezone: Africa/Algiers

# SEO & Site Info
google_analytics:
  id: "G-XSMK4RRZMM"
  pv:
    enabled: false
title: Nizar's Blog
tagline: Cyber Security Engineer
description: >-
  Practical, hands-on posts about DevSecOps, penetration testing, and defensive security.
  Tutorials, tool walkthroughs, secure CI/CD practices, threat modeling, and incident response
  to help engineers build and protect resilient systems.

url: "https://nizar.engineer"
baseurl: ""

# Profile
github:
  username: UsEr-1337-1
twitter:
  username: twitter
social:
  name: Nizar Hakouane
  email: hakouane.nizar@gmail.com
  links:
    - https://twitter.com/twitter
    - https://github.com/UsEr-1337-1
    - https://www.linkedin.com/in/nizar-hakouane

# Avatar & UI
avatar: /assets/img/avatar.png
toc: true
pwa:
  enabled: false
  cache:
    enabled: false
    deny_paths:

# Pagination
paginate: 10

# Markdown & Syntax Highlighting
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Build & Compression
sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# Exclusions
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# Archives (Categories & Tags)
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-archives

